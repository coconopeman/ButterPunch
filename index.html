<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUTTER PUNCH!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Nanum Myeongjo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --surface: #fcfcfa;       /* base canvas / background */
            --line: #545454;          /* signature accent — used for borders/outlines only */
            --accent: #545454;        /* saturated action / brand accent — borders & text only, no fills */
            --accent-hover: #363636;
            --neutral-fill: #f5f5f4;  /* plain neutral panel/input background (no accent tint) */
            --neutral-fill-hover: #ececea;
            --panel-border: #e2e2e0; /* plain neutral border, unrelated to accent hue */
            --ink: #1c2233;           /* primary text */
            --ink-soft: #6b7280;      /* secondary text */
            --danger: #e0455f;
            --danger-soft: #fdedf0;
            --danger-border: #f4c3cd;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
        .font-myeongjo { font-family: 'Nanum Myeongjo', 'Batang', serif; }

        .canvas-bg {
            background-color: var(--surface);
            background-image:
                linear-gradient(to right, rgba(84, 84, 84, 0.16) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(84, 84, 84, 0.16) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Design Card & Container Specs */
        .design-card {
            background-color: var(--surface) !important;
            border: 2px solid var(--line) !important;
            border-radius: 10px !important;
            box-shadow: 0 1px 2px rgba(28, 34, 51, 0.04) !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--line); }

        /* Reusable component classes (kept in sync with JS class toggles).
           Accent color is applied as a BORDER/TEXT color only — no tinted or
           semi-transparent accent fills are used anywhere in the UI. */
        .btn-neutral {
            background: #ffffff;
            border: 1px solid var(--panel-border);
            color: var(--ink);
            transition: background-color .15s ease, border-color .15s ease;
        }
        .btn-neutral:hover:not(:disabled) { background: var(--neutral-fill); }
        .btn-neutral:disabled { opacity: .4; }

        .btn-primary {
            background: var(--surface);
            border: 2px solid var(--accent);
            color: var(--accent);
            transition: background-color .15s ease, color .15s ease, border-color .15s ease;
        }
        .btn-primary:hover { background: var(--accent); color: #ffffff; border-color: var(--accent-hover); }

        .btn-danger-outline {
            background: var(--danger-soft);
            border: 1px solid var(--danger-border);
            color: var(--danger);
            transition: background-color .15s ease;
        }
        .btn-danger-outline:hover { background: #fbdde3; }

        .field-box {
            background: #ffffff;
            border: 1px solid var(--panel-border);
            color: var(--ink);
        }
        .field-box:focus { outline: none; border-color: var(--line); }

        .seg-btn {
            border: 1px solid var(--panel-border);
            background: #ffffff;
            color: var(--ink-soft);
            transition: background-color .15s ease, border-color .15s ease, color .15s ease;
        }
        .seg-btn:hover { background: var(--neutral-fill); color: var(--ink); }
        .seg-btn.active {
            border: 2px solid var(--line);
            background: #ffffff;
            color: var(--accent);
            font-weight: 700;
        }

        .section-title { color: var(--ink); }
        .section-title i { color: var(--accent); }

        /* View-only zoom (does not affect exported image resolution) */
        #canvasWrapper { transform-origin: center center; }
        #zoomIndicator {
            appearance: none;
            display: inline-flex;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--panel-border);
            color: var(--ink-soft);
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 999px;
            cursor: pointer;
            user-select: none;
            font-family: inherit;
        }
        #zoomIndicator:hover { border-color: var(--line); color: var(--ink); }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden select-none" style="background-color: var(--surface);">

    <!-- Top Header Navigation -->
    <header class="h-14 border-b-2 px-4 flex items-center justify-between z-20 shrink-0" style="border-color: var(--line); background-color: var(--surface);">
        <div class="flex items-center gap-2.5">
            <div class="w-7 h-7 rounded-md flex items-center justify-center text-xs font-bold" style="background-color: var(--surface); border: 2px solid var(--accent); color: var(--accent);">
                <i class="fa-solid fa-hole-punch"></i>
            </div>
            <h1 class="font-bold text-lg tracking-wide" style="color: var(--ink);">
                BUTTER PUNCH!
            </h1>
            <button id="zoomIndicator" type="button" title="캔버스 위에서 Ctrl + 스크롤 또는 Ctrl + / - 로 화면 확대·축소 (클릭 시 100%로 초기화)">
                <i class="fa-solid fa-magnifying-glass mr-1"></i><span id="zoomValue">100%</span>
            </button>
        </div>

        <!-- Global Actions -->
        <div class="flex items-center gap-2">
            <button id="btnUndo" disabled class="btn-neutral px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-left text-xs"></i> 실행 취소
            </button>
            <button id="btnRedo" disabled class="btn-neutral px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-right text-xs"></i> 다시 실행
            </button>
            <button id="btnAlign" disabled class="btn-neutral px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5" title="펀칭된 조각들을 격자로 가운데 정렬해요">
                <i class="fa-solid fa-table-cells text-xs"></i> 정렬
            </button>
            <button id="btnClear" class="btn-danger-outline px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid fa-trash-can text-xs"></i> 전체 초기화
            </button>
            <div class="h-4 w-[1px] mx-1" style="background-color: var(--panel-border);"></div>
            <button id="btnDownload" class="btn-primary px-4 py-1.5 rounded-lg font-bold text-xs transition flex items-center gap-2">
                <i class="fa-solid fa-download text-xs"></i> 이미지 저장
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Left Control Panel -->
        <aside class="w-80 border-r-2 flex flex-col z-10 overflow-y-auto p-3 shrink-0" style="border-color: var(--line); background-color: var(--surface);">

            <div class="design-card p-3.5 space-y-4">

                <!-- Image Upload Section -->
                <section class="space-y-2 pb-4 border-b" style="border-color: var(--panel-border);">
                    <h2 class="section-title text-xs font-bold uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-image"></i> 이미지 불러오기
                    </h2>
                    <label id="dropZone" class="group relative flex flex-col items-center justify-center h-20 rounded-lg cursor-pointer transition overflow-hidden" style="border: 2px dashed var(--line); background-color: var(--neutral-fill);">
                        <input type="file" id="imageInput" accept="image/*" class="hidden" />
                        <div class="flex flex-col items-center gap-1 transition" style="color: var(--ink-soft);">
                            <i class="fa-solid fa-cloud-arrow-up text-lg mb-0.5" style="color: var(--accent);"></i>
                            <span class="text-xs font-semibold" style="color: var(--ink);">클릭하거나 사진을 드래그하세요</span>
                            <span class="text-[10px]">PNG, JPG, WEBP 지원</span>
                        </div>
                    </label>
                </section>

                <!-- Box Configuration Section -->
                <section class="space-y-3 pb-4 border-b" style="border-color: var(--panel-border);">
                    <h2 class="section-title text-xs font-bold uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-vector-square"></i> 박스 설정
                    </h2>

                    <!-- Box Color -->
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <label class="text-xs font-semibold" style="color: var(--ink-soft);">박스 색상</label>
                            <div class="flex gap-1">
                                <button type="button" data-boxmode="solid" class="box-mode-btn seg-btn active px-2 py-0.5 rounded-md text-[10px] font-semibold transition">단색</button>
                                <button type="button" data-boxmode="gradient" class="box-mode-btn seg-btn px-2 py-0.5 rounded-md text-[10px] font-semibold transition">그라데이션</button>
                            </div>
                        </div>

                        <!-- Solid color controls -->
                        <div id="boxSolidControls" class="flex items-center gap-2">
                            <input type="color" id="boxColorPicker" value="#545454" class="w-8 h-8 rounded bg-transparent border-0 cursor-pointer">
                            <input type="text" id="boxColorHex" value="#545454" class="field-box flex-1 rounded-lg px-2.5 py-1 text-xs font-mono uppercase">
                        </div>

                        <!-- Gradient controls (top -> bottom only) -->
                        <div id="boxGradientControls" class="hidden space-y-1.5">
                            <div class="flex items-center gap-2">
                                <input type="color" id="boxGradientTopPicker" value="#2b2b2b" class="w-8 h-8 rounded bg-transparent border-0 cursor-pointer">
                                <input type="text" id="boxGradientTopHex" value="#2B2B2B" class="field-box flex-1 rounded-lg px-2.5 py-1 text-xs font-mono uppercase">
                                <span class="text-[10px] w-6 text-right" style="color: var(--ink-soft);">상단</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="color" id="boxGradientBottomPicker" value="#8f8f8f" class="w-8 h-8 rounded bg-transparent border-0 cursor-pointer">
                                <input type="text" id="boxGradientBottomHex" value="#8F8F8F" class="field-box flex-1 rounded-lg px-2.5 py-1 text-xs font-mono uppercase">
                                <span class="text-[10px] w-6 text-right" style="color: var(--ink-soft);">하단</span>
                            </div>
                            <p class="text-[10px] leading-relaxed" style="color: var(--ink-soft);">상단에서 하단으로 자연스럽게 번지는 세로 그라데이션만 지원돼요.</p>
                        </div>
                    </div>

                    <!-- Box Position -->
                    <div>
                        <label class="text-xs font-semibold block mb-1" style="color: var(--ink-soft);">붙일 위치</label>
                        <div class="grid grid-cols-4 gap-1.5">
                            <button data-pos="left" class="pos-btn seg-btn py-1 rounded-lg text-xs font-semibold transition">좌</button>
                            <button data-pos="right" class="pos-btn seg-btn active py-1 rounded-lg text-xs font-semibold transition">우</button>
                            <button data-pos="top" class="pos-btn seg-btn py-1 rounded-lg text-xs font-semibold transition">상</button>
                            <button data-pos="bottom" class="pos-btn seg-btn py-1 rounded-lg text-xs font-semibold transition">하</button>
                        </div>
                    </div>
                </section>

                <!-- Punching Tool Section -->
                <section class="space-y-3 pb-4 border-b" style="border-color: var(--panel-border);">
                    <div class="flex items-center justify-between">
                        <h2 class="section-title text-xs font-bold uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-icons"></i> 펀칭기 도구
                        </h2>
                        <span class="text-[10px] font-normal" style="color: var(--ink-soft);">(우클릭 시 삭제)</span>
                    </div>

                    <!-- Shape Selector -->
                    <div>
                        <div class="grid grid-cols-5 gap-1.5">
                            <button data-shape="circle" title="동그라미" class="shape-btn seg-btn active py-1.5 rounded-lg flex items-center justify-center transition">
                                <i class="fa-regular fa-circle text-sm"></i>
                            </button>
                            <button data-shape="square" title="네모" class="shape-btn seg-btn py-1.5 rounded-lg flex items-center justify-center transition">
                                <i class="fa-regular fa-square text-sm"></i>
                            </button>
                            <button data-shape="triangle" title="정삼각형" class="shape-btn seg-btn py-1.5 rounded-lg flex items-center justify-center transition">
                                <i class="fa-solid fa-play text-sm -rotate-90"></i>
                            </button>
                            <button data-shape="star" title="별" class="shape-btn seg-btn py-1.5 rounded-lg flex items-center justify-center transition">
                                <i class="fa-regular fa-star text-sm"></i>
                            </button>
                            <button data-shape="urchin" title="성게/뾰족이" class="shape-btn seg-btn py-1.5 rounded-lg flex items-center justify-center transition">
                                <i class="fa-solid fa-sun text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Size & Rotation Sliders -->
                    <div class="space-y-2 p-2.5 rounded-lg" style="background-color: var(--neutral-fill); border: 1px solid var(--panel-border);">
                        <div>
                            <div class="flex justify-between text-xs font-semibold mb-1" style="color: var(--ink-soft);">
                                <span>크기 (Size)</span>
                                <span id="sizeVal" class="font-mono font-bold" style="color: var(--ink);">60px</span>
                            </div>
                            <input type="range" id="punchSize" min="15" max="250" value="60" class="w-full cursor-pointer" style="accent-color: var(--accent);">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs font-semibold mb-1" style="color: var(--ink-soft);">
                                <span>회전각 (Rotation)</span>
                                <span id="rotVal" class="font-mono font-bold" style="color: var(--ink);">0°</span>
                            </div>
                            <input type="range" id="punchRot" min="0" max="360" value="0" class="w-full cursor-pointer" style="accent-color: var(--accent);">
                        </div>
                    </div>

                    <!-- Mini Shape Live Preview Box -->
                    <div>
                        <label class="text-xs font-semibold block mb-1" style="color: var(--ink-soft);">미리보기</label>
                        <div class="h-16 rounded-lg flex items-center justify-center relative overflow-hidden" style="background-color: var(--neutral-fill); border: 1px solid var(--panel-border);">
                            <canvas id="miniPreviewCanvas" width="100" height="60"></canvas>
                        </div>
                    </div>
                </section>

                <!-- Text Tool Section -->
                <section class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h2 class="section-title text-xs font-bold uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-font"></i> 글자 쓰기
                        </h2>
                        <span class="text-[10px] font-normal" style="color: var(--ink-soft);">(우클릭 시 수정가능)</span>
                    </div>
                    <div class="space-y-2">
                        <input type="text" id="textInput" placeholder="문구를 입력하세요..." class="field-box font-myeongjo w-full rounded-lg px-2.5 py-1.5 text-xs placeholder-slate-400">
                        <div class="flex items-center gap-2">
                            <input type="color" id="textColorPicker" value="#000000" class="w-8 h-8 rounded bg-transparent border-0 cursor-pointer">
                            <input type="number" id="textSizeInput" value="32" min="10" max="200" class="field-box w-16 rounded-lg px-2 py-1 text-xs">
                            <button id="btnAddText" class="btn-primary flex-1 rounded-lg py-1 text-xs font-bold transition">
                                + 글자 추가
                            </button>
                        </div>
                        <!-- Mini Text Live Preview Box -->
                        <div>
                            <label class="text-xs font-semibold block mb-1" style="color: var(--ink-soft);">미리보기</label>
                            <div class="h-14 rounded-lg flex items-center justify-center relative overflow-hidden p-1" style="background-color: var(--neutral-fill); border: 1px solid var(--panel-border);">
                                <canvas id="textPreviewCanvas" width="220" height="45"></canvas>
                            </div>
                        </div>
                    </div>
                </section>

            </div>

        </aside>

        <!-- Main Interactive Canvas Viewport -->
        <main id="canvasViewport" class="flex-1 canvas-bg relative overflow-auto flex p-8">

            <!-- Canvas Holder -->
            <div id="canvasWrapper" class="relative rounded-lg overflow-hidden border-2 transition-all" style="border-color: var(--line); box-shadow: 0 4px 16px rgba(28, 34, 51, 0.06); margin: auto; flex-shrink: 0;">
                <canvas id="mainCanvas"></canvas>
            </div>

            <!-- Empty State Overlay (When no image is loaded) -->
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center backdrop-blur-xs z-10 pointer-events-none" style="background-color: rgba(252, 252, 250, 0.95);">
                <div class="w-12 h-12 rounded-full flex items-center justify-center mb-3" style="background-color: var(--neutral-fill); border: 1px solid var(--panel-border);">
                    <i class="fa-solid fa-image text-lg" style="color: var(--accent);"></i>
                </div>
                <h3 class="text-base font-bold mb-1" style="color: var(--ink);">사진을 불러와서 시작하세요</h3>
                <p class="text-xs max-w-sm text-center" style="color: var(--ink-soft);">좌측 메뉴에서 사진을 업로드하면 자동으로 박스가 생성됩니다.</p>
            </div>
        </main>
    </div>

    <!-- Text Edit Modal (Right-Click on Text) -->
    <div id="textEditModal" class="hidden fixed inset-0 z-50 flex items-center justify-center backdrop-blur-xs" style="background-color: rgba(28, 34, 51, 0.4);">
        <div class="design-card w-80 p-4 space-y-4" style="color: var(--ink);">
            <div class="flex items-center justify-between border-b pb-2" style="border-color: var(--panel-border);">
                <h3 class="text-sm font-bold flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square" style="color: var(--accent);"></i> 글자 수정 및 설정
                </h3>
                <button id="btnCloseModal" class="text-sm transition" style="color: var(--ink-soft);">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-xs font-semibold block mb-1" style="color: var(--ink-soft);">문구 수정</label>
                    <input type="text" id="modalTextContent" class="field-box font-myeongjo w-full rounded-lg px-2.5 py-1.5 text-xs">
                </div>

                <div>
                    <label class="text-xs font-semibold block mb-1" style="color: var(--ink-soft);">글자 크기 (px)</label>
                    <div class="flex items-center gap-2">
                        <input type="range" id="modalTextSizeSlider" min="10" max="200" class="flex-1 cursor-pointer" style="accent-color: var(--accent);">
                        <input type="number" id="modalTextSizeNum" min="10" max="200" class="field-box w-16 rounded-lg px-2 py-1 text-xs">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-semibold block mb-1" style="color: var(--ink-soft);">글자 색상</label>
                    <input type="color" id="modalTextColor" class="w-full h-8 rounded bg-transparent border-0 cursor-pointer">
                </div>
            </div>

            <div class="flex items-center justify-end gap-2 pt-2 border-t" style="border-color: var(--panel-border);">
                <button id="btnDeleteModalText" class="btn-danger-outline px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                    삭제
                </button>
                <button id="btnSaveModalText" class="btn-primary px-4 py-1.5 rounded-lg text-xs font-bold transition">
                    적용하기
                </button>
            </div>
        </div>
    </div>

    <!-- Align Punches Modal -->
    <div id="alignModal" class="hidden fixed inset-0 z-50 flex items-center justify-center backdrop-blur-xs" style="background-color: rgba(28, 34, 51, 0.4);">
        <div class="design-card w-72 p-4 space-y-4" style="color: var(--ink);">
            <div class="flex items-center justify-between border-b pb-2" style="border-color: var(--panel-border);">
                <h3 class="text-sm font-bold flex items-center gap-2">
                    <i class="fa-solid fa-table-cells" style="color: var(--accent);"></i> 펀칭 정렬
                </h3>
                <button id="btnCloseAlignModal" class="text-sm transition" style="color: var(--ink-soft);">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-xs font-semibold block mb-1" style="color: var(--ink-soft);">가로 최대 개수</label>
                    <input type="number" id="alignColumnsInput" min="1" max="30" value="3" class="field-box w-full rounded-lg px-2.5 py-1.5 text-xs">
                </div>
                <div>
                    <label class="text-xs font-semibold block mb-1" style="color: var(--ink-soft);">조각 사이 간격 (px)</label>
                    <input type="number" id="alignGapInput" min="0" max="200" value="6" class="field-box w-full rounded-lg px-2.5 py-1.5 text-xs">
                </div>
                <p class="text-[10px] leading-relaxed" style="color: var(--ink-soft);">지정한 개수만큼 가로로 채운 뒤 다음 줄로 넘어가면서, 지정한 간격만큼만 띄워 겹치지 않게 가운데 정렬돼요.</p>
            </div>

            <div class="flex items-center justify-end gap-2 pt-2 border-t" style="border-color: var(--panel-border);">
                <button id="btnCancelAlign" class="btn-neutral px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                    취소
                </button>
                <button id="btnApplyAlign" class="btn-primary px-4 py-1.5 rounded-lg text-xs font-bold transition">
                    정렬하기
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            image: null,           // HTMLImageElement
            imageWidth: 0,
            imageHeight: 0,
            boxColor: '#545454',
            boxColorMode: 'solid', // 'solid' | 'gradient'
            boxGradient: { top: '#2b2b2b', bottom: '#8f8f8f' }, // top -> bottom only
            boxPosition: 'right',  // 'right' | 'left' | 'top' | 'bottom'
            punch: {
                shape: 'circle',   // 'circle', 'square', 'triangle', 'star', 'urchin'
                size: 60,
                rotation: 0
            },
            punches: [],           // [{ id, imageRelativeX, imageRelativeY, boxRelativeX, boxRelativeY, shape, size, rotation }]
                                    // imageRelative* = fixed hole position on the photo (never touched by Align).
                                    // boxRelative*   = where the matching piece sits on the box (Align moves only this).
                                    // The picture shown inside the box piece always samples the photo at
                                    // imageRelative*, so it keeps showing what was originally punched there.
            texts: [],             // [{ id, x, y, content, color, size }]
            history: [],           // Undo stack
            redoStack: [],         // Redo stack
            selectedTextIndex: -1, // Currently dragged text index
            isDraggingText: false,
            dragOffset: { x: 0, y: 0 },
            mousePos: { x: 0, y: 0 },
            isHoveringCanvas: false,
            editingTextIndex: -1,
            viewZoom: 1,            // display-only scale of #canvasWrapper; never affects saved image size
            isHoveringViewport: false,
            isPanning: false,
            panStart: null,
            lastAlignColumns: 3,
            lastAlignGap: 6
        };

        // --- DOM Elements ---
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d');
        const miniPreviewCanvas = document.getElementById('miniPreviewCanvas');
        const miniCtx = miniPreviewCanvas.getContext('2d');
        const textPreviewCanvas = document.getElementById('textPreviewCanvas');
        const textPreviewCtx = textPreviewCanvas.getContext('2d');

        const emptyState = document.getElementById('emptyState');
        const imageInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');

        const boxColorPicker = document.getElementById('boxColorPicker');
        const boxColorHex = document.getElementById('boxColorHex');
        const boxSolidControls = document.getElementById('boxSolidControls');
        const boxGradientControls = document.getElementById('boxGradientControls');
        const boxGradientTopPicker = document.getElementById('boxGradientTopPicker');
        const boxGradientTopHex = document.getElementById('boxGradientTopHex');
        const boxGradientBottomPicker = document.getElementById('boxGradientBottomPicker');
        const boxGradientBottomHex = document.getElementById('boxGradientBottomHex');

        const punchSize = document.getElementById('punchSize');
        const punchRot = document.getElementById('punchRot');
        const sizeVal = document.getElementById('sizeVal');
        const rotVal = document.getElementById('rotVal');

        const textInput = document.getElementById('textInput');
        const textColorPicker = document.getElementById('textColorPicker');
        const textSizeInput = document.getElementById('textSizeInput');
        const btnAddText = document.getElementById('btnAddText');

        const btnUndo = document.getElementById('btnUndo');
        const btnRedo = document.getElementById('btnRedo');
        const btnAlign = document.getElementById('btnAlign');
        const btnClear = document.getElementById('btnClear');
        const btnDownload = document.getElementById('btnDownload');

        // Align Modal Elements
        const alignModal = document.getElementById('alignModal');
        const alignColumnsInput = document.getElementById('alignColumnsInput');
        const alignGapInput = document.getElementById('alignGapInput');
        const btnCloseAlignModal = document.getElementById('btnCloseAlignModal');
        const btnCancelAlign = document.getElementById('btnCancelAlign');
        const btnApplyAlign = document.getElementById('btnApplyAlign');

        // View-zoom elements (display-only; does not touch canvas resolution)
        const canvasViewport = document.getElementById('canvasViewport');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const zoomIndicator = document.getElementById('zoomIndicator');
        const zoomValue = document.getElementById('zoomValue');

        // Modal Elements
        const textEditModal = document.getElementById('textEditModal');
        const modalTextContent = document.getElementById('modalTextContent');
        const modalTextSizeSlider = document.getElementById('modalTextSizeSlider');
        const modalTextSizeNum = document.getElementById('modalTextSizeNum');
        const modalTextColor = document.getElementById('modalTextColor');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const btnDeleteModalText = document.getElementById('btnDeleteModalText');
        const btnSaveModalText = document.getElementById('btnSaveModalText');

        // Shared class strings so JS-driven state toggles stay visually consistent
        const POS_BTN_BASE = 'pos-btn seg-btn py-1 rounded-lg text-xs font-semibold transition';
        const POS_BTN_ACTIVE = 'pos-btn seg-btn active py-1 rounded-lg text-xs font-semibold transition';
        const SHAPE_BTN_BASE = 'shape-btn seg-btn py-1.5 rounded-lg flex items-center justify-center transition';
        const SHAPE_BTN_ACTIVE = 'shape-btn seg-btn active py-1.5 rounded-lg flex items-center justify-center transition';
        const BOX_MODE_BTN_BASE = 'box-mode-btn seg-btn px-2 py-0.5 rounded-md text-[10px] font-semibold transition';
        const BOX_MODE_BTN_ACTIVE = 'box-mode-btn seg-btn active px-2 py-0.5 rounded-md text-[10px] font-semibold transition';

        // --- History Management ---
        function saveHistory() {
            const snap = {
                boxColor: state.boxColor,
                boxColorMode: state.boxColorMode,
                boxGradient: { ...state.boxGradient },
                boxPosition: state.boxPosition,
                punches: JSON.parse(JSON.stringify(state.punches)),
                texts: JSON.parse(JSON.stringify(state.texts))
            };
            state.history.push(snap);
            state.redoStack = [];
            updateUndoRedoButtons();
            updateAlignButtonState();
        }

        function updateUndoRedoButtons() {
            btnUndo.disabled = state.history.length <= 1;
            btnRedo.disabled = state.redoStack.length === 0;
        }

        function updateAlignButtonState() {
            btnAlign.disabled = !state.image || state.punches.length === 0;
        }

        function undo() {
            if (state.history.length > 1) {
                const current = state.history.pop();
                state.redoStack.push(current);
                const prev = state.history[state.history.length - 1];
                applySnapshot(prev);
                updateUndoRedoButtons();
                render();
            }
        }

        function redo() {
            if (state.redoStack.length > 0) {
                const next = state.redoStack.pop();
                state.history.push(next);
                applySnapshot(next);
                updateUndoRedoButtons();
                render();
            }
        }

        function applySnapshot(snap) {
            state.boxColor = snap.boxColor;
            state.boxColorMode = snap.boxColorMode || 'solid';
            state.boxGradient = snap.boxGradient ? { ...snap.boxGradient } : { top: '#2b2b2b', bottom: '#8f8f8f' };
            state.boxPosition = snap.boxPosition;
            state.punches = JSON.parse(JSON.stringify(snap.punches));
            state.texts = JSON.parse(JSON.stringify(snap.texts));

            boxColorPicker.value = state.boxColor;
            boxColorHex.value = state.boxColor.toUpperCase();
            boxGradientTopPicker.value = state.boxGradient.top;
            boxGradientTopHex.value = state.boxGradient.top.toUpperCase();
            boxGradientBottomPicker.value = state.boxGradient.bottom;
            boxGradientBottomHex.value = state.boxGradient.bottom.toUpperCase();
            updateBoxModeUI();
            rebuildBoxColorLayer();

            document.querySelectorAll('.pos-btn').forEach(b => {
                b.className = (b.dataset.pos === state.boxPosition) ? POS_BTN_ACTIVE : POS_BTN_BASE;
            });

            updateAlignButtonState();
            centerViewport();
        }

        function updateBoxModeUI() {
            document.querySelectorAll('.box-mode-btn').forEach(b => {
                b.className = (b.dataset.boxmode === state.boxColorMode) ? BOX_MODE_BTN_ACTIVE : BOX_MODE_BTN_BASE;
            });
            if (state.boxColorMode === 'gradient') {
                boxSolidControls.classList.add('hidden');
                boxGradientControls.classList.remove('hidden');
            } else {
                boxSolidControls.classList.remove('hidden');
                boxGradientControls.classList.add('hidden');
            }
        }

        // Offscreen canvas holding the current box "material" (solid color or
        // top->bottom gradient) at the image's own dimensions. Both the adjacent
        // box and any punched-out holes on the photo sample their color from
        // this single layer, so solid and gradient modes render identically.
        const boxLayerCanvas = document.createElement('canvas');
        const boxLayerCtx = boxLayerCanvas.getContext('2d');

        function rebuildBoxColorLayer() {
            const w = state.imageWidth;
            const h = state.imageHeight;
            if (!w || !h) return;

            boxLayerCanvas.width = w;
            boxLayerCanvas.height = h;

            if (state.boxColorMode === 'gradient') {
                const grad = boxLayerCtx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, state.boxGradient.top);
                grad.addColorStop(1, state.boxGradient.bottom);
                boxLayerCtx.fillStyle = grad;
            } else {
                boxLayerCtx.fillStyle = state.boxColor;
            }
            boxLayerCtx.fillRect(0, 0, w, h);
        }

        // --- Image Loading ---
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadImageFromFile(file);
        });

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                loadImageFromFile(e.dataTransfer.files[0]);
            }
        });

        function loadImageFromFile(file) {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    // Some phone photos carry an EXIF orientation tag (portrait shots are
                    // often stored as rotated landscape pixels + a "please rotate 90°"
                    // flag). A plain <img> respects that tag when painted normally, but a
                    // canvas drawImage() call made *inside* an active rotate/translate
                    // transform (exactly what the punch-to-box slice below does) can
                    // apply that correction inconsistently across browsers, which is what
                    // produced the occasional "punched slice looks rotated 90°" glitch.
                    // Baking the image onto a plain canvas once, up front, "burns in" the
                    // correct orientation as plain pixels with no leftover metadata, so
                    // every later drawImage() of it — transformed or not — behaves
                    // identically.
                    const normalized = document.createElement('canvas');
                    normalized.width = img.naturalWidth || img.width;
                    normalized.height = img.naturalHeight || img.height;
                    normalized.getContext('2d').drawImage(img, 0, 0);

                    state.image = normalized;
                    state.imageWidth = normalized.width;
                    state.imageHeight = normalized.height;
                    state.punches = [];
                    state.texts = [];
                    state.history = [];
                    state.redoStack = [];
                    emptyState.style.display = 'none';
                    resetZoom();
                    rebuildBoxColorLayer();
                    saveHistory();
                    render();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- Control Listeners ---
        boxColorPicker.addEventListener('input', (e) => {
            state.boxColor = e.target.value;
            boxColorHex.value = e.target.value;
            rebuildBoxColorLayer();
            render();
        });
        boxColorPicker.addEventListener('change', () => saveHistory());

        boxColorHex.addEventListener('change', (e) => {
            let val = e.target.value;
            if (!val.startsWith('#')) val = '#' + val;
            if (/^#[0-9A-F]{6}$/i.test(val)) {
                state.boxColor = val;
                boxColorPicker.value = val;
                rebuildBoxColorLayer();
                saveHistory();
                render();
            }
        });

        // Box color mode toggle: solid vs. top->bottom gradient
        document.querySelectorAll('.box-mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (state.boxColorMode === btn.dataset.boxmode) return;
                state.boxColorMode = btn.dataset.boxmode;
                updateBoxModeUI();
                rebuildBoxColorLayer();
                saveHistory();
                render();
            });
        });

        function handleGradientColorInput(stop, value) {
            state.boxGradient[stop] = value;
            rebuildBoxColorLayer();
            render();
        }

        boxGradientTopPicker.addEventListener('input', (e) => {
            boxGradientTopHex.value = e.target.value;
            handleGradientColorInput('top', e.target.value);
        });
        boxGradientTopPicker.addEventListener('change', () => saveHistory());

        boxGradientTopHex.addEventListener('change', (e) => {
            let val = e.target.value;
            if (!val.startsWith('#')) val = '#' + val;
            if (/^#[0-9A-F]{6}$/i.test(val)) {
                boxGradientTopPicker.value = val;
                handleGradientColorInput('top', val);
                saveHistory();
            }
        });

        boxGradientBottomPicker.addEventListener('input', (e) => {
            boxGradientBottomHex.value = e.target.value;
            handleGradientColorInput('bottom', e.target.value);
        });
        boxGradientBottomPicker.addEventListener('change', () => saveHistory());

        boxGradientBottomHex.addEventListener('change', (e) => {
            let val = e.target.value;
            if (!val.startsWith('#')) val = '#' + val;
            if (/^#[0-9A-F]{6}$/i.test(val)) {
                boxGradientBottomPicker.value = val;
                handleGradientColorInput('bottom', val);
                saveHistory();
            }
        });

        document.querySelectorAll('.pos-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.pos-btn').forEach(b => { b.className = POS_BTN_BASE; });
                btn.className = POS_BTN_ACTIVE;
                state.boxPosition = btn.dataset.pos;
                saveHistory();
                render();
                centerViewport();
            });
        });

        document.querySelectorAll('.shape-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.shape-btn').forEach(b => { b.className = SHAPE_BTN_BASE; });
                btn.className = SHAPE_BTN_ACTIVE;
                state.punch.shape = btn.dataset.shape;
                renderMiniPreview();
                render();
            });
        });

        punchSize.addEventListener('input', (e) => {
            state.punch.size = parseInt(e.target.value);
            sizeVal.textContent = `${state.punch.size}px`;
            renderMiniPreview();
            render();
        });

        punchRot.addEventListener('input', (e) => {
            state.punch.rotation = parseInt(e.target.value);
            rotVal.textContent = `${state.punch.rotation}°`;
            renderMiniPreview();
            render();
        });

        // Text Live Inputs
        textInput.addEventListener('input', renderTextPreview);
        textColorPicker.addEventListener('input', renderTextPreview);
        textSizeInput.addEventListener('input', renderTextPreview);

        btnAddText.addEventListener('click', () => {
            const content = textInput.value.trim();
            if (!content || !state.image) return;

            // Add centered in current total layout
            const layout = getLayout();
            state.texts.push({
                id: Date.now(),
                x: layout.totalWidth / 2,
                y: layout.totalHeight / 2,
                content: content,
                color: textColorPicker.value,
                size: parseInt(textSizeInput.value) || 32
            });
            textInput.value = '';
            renderTextPreview();
            saveHistory();
            render();
        });

        // Top Actions
        btnUndo.addEventListener('click', undo);
        btnRedo.addEventListener('click', redo);
        btnClear.addEventListener('click', () => {
            if (!state.image) return;
            state.punches = [];
            state.texts = [];
            saveHistory();
            render();
        });

        // --- Align Punches ---
        // Rearranges only the BOX-side pieces into a tidy grid — the holes on the
        // photo (imageRelativeX/Y) are never touched, and each piece keeps showing
        // the photo content from its original punch spot no matter where it moves.
        // Rows are packed left-aligned (every row starts at the same X), and the
        // whole block of rows is then centered as one unit, both horizontally and
        // vertically, within the box. The gap between pieces is user-adjustable.

        btnAlign.addEventListener('click', () => {
            if (!state.image || state.punches.length === 0) return;
            alignColumnsInput.value = state.lastAlignColumns || 3;
            alignGapInput.value = state.lastAlignGap ?? 6;
            alignModal.classList.remove('hidden');
            alignColumnsInput.focus();
            alignColumnsInput.select();
        });

        function closeAlignModal() { alignModal.classList.add('hidden'); }
        btnCloseAlignModal.addEventListener('click', closeAlignModal);
        btnCancelAlign.addEventListener('click', closeAlignModal);

        btnApplyAlign.addEventListener('click', () => {
            const columns = Math.max(1, parseInt(alignColumnsInput.value, 10) || 1);
            const gap = Math.max(0, parseInt(alignGapInput.value, 10) || 0);
            state.lastAlignColumns = columns;
            state.lastAlignGap = gap;
            alignPunchesGrid(columns, gap);
            closeAlignModal();
        });

        [alignColumnsInput, alignGapInput].forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    btnApplyAlign.click();
                }
            });
        });

        function alignPunchesGrid(columns, gap) {
            if (state.punches.length === 0) return;
            const w = state.imageWidth;
            const h = state.imageHeight;

            // Ordering always comes from the fixed hole positions on the photo
            // (imageRelativeX/Y), never from wherever the box pieces currently sit —
            // that way re-running Align with different settings is always based on
            // the same stable reading order.
            const ordered = [...state.punches].sort((a, b) => {
                if (Math.abs(a.imageRelativeY - b.imageRelativeY) > 1) return a.imageRelativeY - b.imageRelativeY;
                return a.imageRelativeX - b.imageRelativeX;
            });

            const rows = [];
            for (let i = 0; i < ordered.length; i += columns) {
                rows.push(ordered.slice(i, i + columns));
            }

            const rowHeights = rows.map(row => Math.max(...row.map(p => p.size)));
            const rowWidths = rows.map(row => row.reduce((sum, p) => sum + p.size, 0) + gap * (row.length - 1));

            // The block's own size is set by its widest row and total stacked
            // height — rows don't each center themselves, they all share the same
            // left edge; only this outer block gets centered in the box.
            const blockWidth = Math.max(...rowWidths);
            const blockHeight = rowHeights.reduce((sum, rh) => sum + rh, 0) + gap * (rows.length - 1);
            const blockLeft = Math.max(0, (w - blockWidth) / 2);
            const blockTop = Math.max(0, (h - blockHeight) / 2);

            let currentY = blockTop;
            rows.forEach((row, rowIndex) => {
                const rowHeight = rowHeights[rowIndex];
                let currentX = blockLeft; // left-aligned: every row starts at the same X

                row.forEach(p => {
                    p.boxRelativeX = currentX + p.size / 2;
                    p.boxRelativeY = currentY + rowHeight / 2;
                    currentX += p.size + gap;
                });

                currentY += rowHeight + gap;
            });

            saveHistory();
            render();
        }

        btnDownload.addEventListener('click', () => {
            if (!state.image) return;
            // Render clean version without hover overlays
            render(true);
            const link = document.createElement('a');
            link.download = `butter_punch_${Date.now()}.png`;
            link.href = mainCanvas.toDataURL('image/png');
            link.click();
            render();
        });

        // Keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                if (e.shiftKey) redo();
                else undo();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                redo();
            }
        });

        // --- View Zoom (display-only: scales the on-screen canvas frame via CSS transform.
        //     The <canvas> element's own width/height — and therefore the saved PNG — never change.) ---
        const ZOOM_MIN = 0.2;
        const ZOOM_MAX = 3;
        const ZOOM_STEP = 0.1;

        function applyZoom() {
            canvasWrapper.style.transform = `scale(${state.viewZoom})`;
            zoomValue.textContent = `${Math.round(state.viewZoom * 100)}%`;
            centerViewport();
        }

        function setZoom(nextZoom) {
            state.viewZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, nextZoom));
            applyZoom();
        }

        function zoomIn() { setZoom(state.viewZoom + ZOOM_STEP); }
        function zoomOut() { setZoom(state.viewZoom - ZOOM_STEP); }
        function resetZoom() { setZoom(1); }

        // Keep the image+box composite centered in the viewport whenever it doesn't
        // fully fit (e.g. the browser window is narrow, or a left/right box makes
        // the canvas twice as wide). Without this, an overflowing canvas would just
        // sit flush against one edge instead of staying centered.
        function centerViewport() {
            requestAnimationFrame(() => {
                canvasViewport.scrollLeft = Math.max(0, (canvasViewport.scrollWidth - canvasViewport.clientWidth) / 2);
                canvasViewport.scrollTop = Math.max(0, (canvasViewport.scrollHeight - canvasViewport.clientHeight) / 2);
            });
        }

        window.addEventListener('resize', centerViewport);

        // Middle-mouse-button drag panning (left click is used for punching/dragging
        // text, right click for delete/edit, so the middle button is free for panning
        // without any conflict) — handy when zoomed in or the canvas is larger than
        // the visible viewport.
        canvasViewport.addEventListener('mousedown', (e) => {
            if (e.button !== 1) return;
            e.preventDefault();
            state.isPanning = true;
            state.panStart = {
                x: e.clientX,
                y: e.clientY,
                scrollLeft: canvasViewport.scrollLeft,
                scrollTop: canvasViewport.scrollTop
            };
            canvasViewport.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!state.isPanning || !state.panStart) return;
            canvasViewport.scrollLeft = state.panStart.scrollLeft - (e.clientX - state.panStart.x);
            canvasViewport.scrollTop = state.panStart.scrollTop - (e.clientY - state.panStart.y);
        });

        window.addEventListener('mouseup', () => {
            if (!state.isPanning) return;
            state.isPanning = false;
            state.panStart = null;
            canvasViewport.style.cursor = '';
        });

        canvasViewport.addEventListener('mouseenter', () => { state.isHoveringViewport = true; });
        canvasViewport.addEventListener('mouseleave', () => { state.isHoveringViewport = false; });

        // Ctrl + '+' / Ctrl + '-' (also Ctrl + '0' to reset) while hovering the image area
        window.addEventListener('keydown', (e) => {
            if (!state.isHoveringViewport) return;
            if (!(e.ctrlKey || e.metaKey)) return;

            if (e.key === '+' || e.key === '=') {
                e.preventDefault();
                zoomIn();
            } else if (e.key === '-' || e.key === '_') {
                e.preventDefault();
                zoomOut();
            } else if (e.key === '0') {
                e.preventDefault();
                resetZoom();
            }
        });

        // Ctrl + scroll wheel is the more natural gesture for the same action
        canvasViewport.addEventListener('wheel', (e) => {
            if (!(e.ctrlKey || e.metaKey)) return;
            e.preventDefault();
            if (e.deltaY < 0) zoomIn();
            else zoomOut();
        }, { passive: false });

        // Click the badge to snap back to 100%
        zoomIndicator.addEventListener('click', resetZoom);

        // --- Shape Drawing Functions ---
        function drawShapePath(ctx, shape, radius) {
            ctx.beginPath();
            if (shape === 'circle') {
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
            } else if (shape === 'square') {
                ctx.rect(-radius, -radius, radius * 2, radius * 2);
            } else if (shape === 'triangle') {
                // Equilateral Triangle
                ctx.moveTo(0, -radius);
                ctx.lineTo(radius * (Math.sqrt(3) / 2), radius / 2);
                ctx.lineTo(-radius * (Math.sqrt(3) / 2), radius / 2);
                ctx.closePath();
            } else if (shape === 'star') {
                const points = 5;
                const innerRadius = radius * 0.4;
                for (let i = 0; i < points * 2; i++) {
                    const r = (i % 2 === 0) ? radius : innerRadius;
                    const angle = (i * Math.PI) / points - Math.PI / 2;
                    const x = Math.cos(angle) * r;
                    const y = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
            } else if (shape === 'urchin') {
                // Spiky Urchin / Sun Shape
                const points = 16;
                const innerRadius = radius * 0.65;
                for (let i = 0; i < points * 2; i++) {
                    const r = (i % 2 === 0) ? radius : innerRadius;
                    const angle = (i * Math.PI) / points;
                    const x = Math.cos(angle) * r;
                    const y = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
            }
        }

        // --- Mini Live Previews ---
        function renderMiniPreview() {
            miniCtx.clearRect(0, 0, miniPreviewCanvas.width, miniPreviewCanvas.height);
            miniCtx.save();
            miniCtx.translate(miniPreviewCanvas.width / 2, miniPreviewCanvas.height / 2);
            miniCtx.rotate((state.punch.rotation * Math.PI) / 180);

            // Scaled radius relative to punch size (15px -> 250px mapped to 5px -> 26px)
            const radius = ((state.punch.size - 15) / (250 - 15)) * 21 + 5;

            miniCtx.fillStyle = '#718a7d';
            drawShapePath(miniCtx, state.punch.shape, radius);
            miniCtx.fill();
            miniCtx.strokeStyle = '#4f6358';
            miniCtx.lineWidth = 1.5;
            miniCtx.stroke();
            miniCtx.restore();
        }

        function renderTextPreview() {
            textPreviewCtx.clearRect(0, 0, textPreviewCanvas.width, textPreviewCanvas.height);
            const textVal = textInput.value.trim() || '미리보기 문구';
            const sizeVal = parseInt(textSizeInput.value) || 32;
            const colorVal = textColorPicker.value;

            textPreviewCtx.save();
            // Dynamically scale text size in preview box
            const scaleFactor = Math.min(Math.max(sizeVal / 32, 0.4), 2.2);
            const previewFontSize = Math.round(18 * scaleFactor);

            textPreviewCtx.font = `bold ${previewFontSize}px 'Nanum Myeongjo', 'Batang', serif`;
            textPreviewCtx.fillStyle = colorVal;
            textPreviewCtx.textAlign = 'center';
            textPreviewCtx.textBaseline = 'middle';

            textPreviewCtx.fillText(textVal, textPreviewCanvas.width / 2, textPreviewCanvas.height / 2);
            textPreviewCtx.restore();
        }

        // --- Layout Helper ---
        function getLayout() {
            const w = state.imageWidth;
            const h = state.imageHeight;
            let imgX = 0, imgY = 0, boxX = 0, boxY = 0;
            let totalWidth = w, totalHeight = h;

            if (state.boxPosition === 'right') {
                boxX = w;
                totalWidth = w * 2;
            } else if (state.boxPosition === 'left') {
                imgX = w;
                totalWidth = w * 2;
            } else if (state.boxPosition === 'bottom') {
                boxY = h;
                totalHeight = h * 2;
            } else if (state.boxPosition === 'top') {
                imgY = h;
                totalHeight = h * 2;
            }

            return { w, h, imgX, imgY, boxX, boxY, totalWidth, totalHeight };
        }

        // --- Main Canvas Render Loop ---
        function render(isExport = false) {
            if (!state.image) return;

            const layout = getLayout();
            mainCanvas.width = layout.totalWidth;
            mainCanvas.height = layout.totalHeight;

            // 1. Draw the Box (solid color or top->bottom gradient, via the pre-rendered box layer)
            ctx.drawImage(boxLayerCanvas, layout.boxX, layout.boxY, layout.w, layout.h);

            // 2. Draw Original Base Image
            ctx.drawImage(state.image, layout.imgX, layout.imgY, layout.w, layout.h);

            // 3. Render All Punch Operations
            state.punches.forEach(p => {
                const radius = p.size / 2;
                const rotRad = (p.rotation * Math.PI) / 180;

                // 3-1: Fill the hole on the Image with the Box material (color/gradient).
                // Always at the hole's original (fixed) position — Align never moves this.
                ctx.save();
                ctx.translate(layout.imgX + p.imageRelativeX, layout.imgY + p.imageRelativeY);
                ctx.rotate(rotRad);
                drawShapePath(ctx, p.shape, radius);
                ctx.clip();
                ctx.drawImage(boxLayerCanvas, -p.imageRelativeX, -p.imageRelativeY, layout.w, layout.h);
                ctx.restore();

                // 3-2: Draw the matching piece on the Box. It's positioned at
                // boxRelativeX/Y (which Align is free to rearrange), but always
                // shows the photo as it looked at the ORIGINAL punch spot
                // (imageRelativeX/Y) — moving a piece around the box never changes
                // what picture is inside it.
                ctx.save();
                ctx.translate(layout.boxX + p.boxRelativeX, layout.boxY + p.boxRelativeY);
                ctx.rotate(rotRad);
                drawShapePath(ctx, p.shape, radius);
                ctx.clip(); // Clip slice shape

                ctx.drawImage(
                    state.image,
                    0, 0, layout.w, layout.h,
                    -p.imageRelativeX, -p.imageRelativeY, layout.w, layout.h
                );
                ctx.restore();
            });

            // 4. Render All Text Elements (Nanum Myeongjo, No harsh drop shadow)
            state.texts.forEach(t => {
                ctx.save();
                ctx.font = `bold ${t.size}px 'Nanum Myeongjo', 'Batang', serif`;
                ctx.fillStyle = t.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                ctx.fillText(t.content, t.x, t.y);
                ctx.restore();
            });

            // 5. Draw Punch Hover Cursor Overlay (When hovering image area)
            if (!isExport && state.isHoveringCanvas) {
                const rel = getRelativeImageCoords(state.mousePos.x, state.mousePos.y);
                if (rel) {
                    ctx.save();
                    ctx.translate(layout.imgX + rel.x, layout.imgY + rel.y);
                    ctx.rotate((state.punch.rotation * Math.PI) / 180);
                    drawShapePath(ctx, state.punch.shape, state.punch.size / 2);

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.strokeStyle = '#1c2233';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        // --- Mouse Interaction & Coordinates ---
        function getCanvasMousePos(e) {
            const rect = mainCanvas.getBoundingClientRect();
            const scaleX = mainCanvas.width / rect.width;
            const scaleY = mainCanvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function getRelativeImageCoords(cx, cy) {
            const layout = getLayout();
            if (
                cx >= layout.imgX && cx <= layout.imgX + layout.w &&
                cy >= layout.imgY && cy <= layout.imgY + layout.h
            ) {
                return { x: cx - layout.imgX, y: cy - layout.imgY };
            }
            return null;
        }

        function getTextAtPos(cx, cy) {
            ctx.save();
            for (let i = state.texts.length - 1; i >= 0; i--) {
                const t = state.texts[i];
                ctx.font = `bold ${t.size}px 'Nanum Myeongjo', 'Batang', serif`;
                const metrics = ctx.measureText(t.content);
                const w = metrics.width;
                const h = t.size;

                if (
                    cx >= t.x - w / 2 - 8 && cx <= t.x + w / 2 + 8 &&
                    cy >= t.y - h / 2 - 8 && cy <= t.y + h / 2 + 8
                ) {
                    ctx.restore();
                    return i;
                }
            }
            ctx.restore();
            return -1;
        }

        function getPunchAtPos(cx, cy) {
            const layout = getLayout();
            let rel = null;
            let area = null;

            // Check if click was on image area (holes live at imageRelativeX/Y there)
            if (cx >= layout.imgX && cx <= layout.imgX + layout.w && cy >= layout.imgY && cy <= layout.imgY + layout.h) {
                rel = { x: cx - layout.imgX, y: cy - layout.imgY };
                area = 'image';
            }
            // Check if click was on box area (pieces live at boxRelativeX/Y there,
            // which can differ from the hole's position once Align has run)
            else if (cx >= layout.boxX && cx <= layout.boxX + layout.w && cy >= layout.boxY && cy <= layout.boxY + layout.h) {
                rel = { x: cx - layout.boxX, y: cy - layout.boxY };
                area = 'box';
            }

            if (!rel) return -1;

            // Check punches in reverse (topmost first)
            for (let i = state.punches.length - 1; i >= 0; i--) {
                const p = state.punches[i];
                const px = area === 'image' ? p.imageRelativeX : p.boxRelativeX;
                const py = area === 'image' ? p.imageRelativeY : p.boxRelativeY;
                const dx = rel.x - px;
                const dy = rel.y - py;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist <= p.size / 2) {
                    return i;
                }
            }
            return -1;
        }

        // --- Canvas Event Listeners ---
        mainCanvas.addEventListener('mouseenter', () => { state.isHoveringCanvas = true; });
        mainCanvas.addEventListener('mouseleave', () => {
            state.isHoveringCanvas = false;
            state.isDraggingText = false;
            render();
        });

        mainCanvas.addEventListener('mousemove', (e) => {
            const pos = getCanvasMousePos(e);
            state.mousePos = pos;

            if (state.isDraggingText && state.selectedTextIndex !== -1) {
                state.texts[state.selectedTextIndex].x = pos.x - state.dragOffset.x;
                state.texts[state.selectedTextIndex].y = pos.y - state.dragOffset.y;
                render();
                return;
            }

            render();
        });

        mainCanvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; // Left click only
            const pos = getCanvasMousePos(e);

            // 1. Check if clicking on existing text to drag
            const textIdx = getTextAtPos(pos.x, pos.y);
            if (textIdx !== -1) {
                state.selectedTextIndex = textIdx;
                state.isDraggingText = true;
                state.dragOffset = {
                    x: pos.x - state.texts[textIdx].x,
                    y: pos.y - state.texts[textIdx].y
                };
                return;
            }

            // 2. Perform Punch if clicked on Image
            const rel = getRelativeImageCoords(pos.x, pos.y);
            if (rel) {
                state.punches.push({
                    id: Date.now(),
                    imageRelativeX: rel.x,
                    imageRelativeY: rel.y,
                    boxRelativeX: rel.x,   // starts matching the hole 1:1; Align can move only this
                    boxRelativeY: rel.y,
                    shape: state.punch.shape,
                    size: state.punch.size,
                    rotation: state.punch.rotation
                });
                saveHistory();
                render();
            }
        });

        mainCanvas.addEventListener('mouseup', (e) => {
            if (e.button === 0 && state.isDraggingText) {
                state.isDraggingText = false;
                saveHistory();
            }
        });

        // Context Menu (Right Click Delete or Edit)
        mainCanvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const pos = getCanvasMousePos(e);

            // 1. Right Click on Text -> Open Edit Modal
            const textIdx = getTextAtPos(pos.x, pos.y);
            if (textIdx !== -1) {
                openTextEditModal(textIdx);
                return;
            }

            // 2. Right Click on Punch -> Delete Punch
            const punchIdx = getPunchAtPos(pos.x, pos.y);
            if (punchIdx !== -1) {
                state.punches.splice(punchIdx, 1);
                saveHistory();
                render();
            }
        });

        // --- Text Edit Modal Functionality ---
        function openTextEditModal(index) {
            state.editingTextIndex = index;
            const t = state.texts[index];

            modalTextContent.value = t.content;
            modalTextSizeSlider.value = t.size;
            modalTextSizeNum.value = t.size;
            modalTextColor.value = t.color;

            textEditModal.classList.remove('hidden');
        }

        function closeTextEditModal() {
            textEditModal.classList.add('hidden');
            state.editingTextIndex = -1;
        }

        modalTextSizeSlider.addEventListener('input', (e) => {
            modalTextSizeNum.value = e.target.value;
        });

        modalTextSizeNum.addEventListener('input', (e) => {
            modalTextSizeSlider.value = e.target.value;
        });

        btnCloseModal.addEventListener('click', closeTextEditModal);

        btnDeleteModalText.addEventListener('click', () => {
            if (state.editingTextIndex !== -1) {
                state.texts.splice(state.editingTextIndex, 1);
                closeTextEditModal();
                saveHistory();
                render();
            }
        });

        btnSaveModalText.addEventListener('click', () => {
            if (state.editingTextIndex !== -1) {
                const content = modalTextContent.value.trim();
                if (content) {
                    state.texts[state.editingTextIndex].content = content;
                    state.texts[state.editingTextIndex].size = parseInt(modalTextSizeNum.value) || 32;
                    state.texts[state.editingTextIndex].color = modalTextColor.value;
                    closeTextEditModal();
                    saveHistory();
                    render();
                }
            }
        });

        // --- Init Previews ---
        renderMiniPreview();
        renderTextPreview();
    </script>
</body>
</html>
